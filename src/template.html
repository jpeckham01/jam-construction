<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1f1e; --ink-2:#4a4f4c; --paper:#f6f3ee; --card:#ffffff;
    --line:#e3ddd3; --accent:#c8641e; --accent-dk:#a44f12; --deep:#23302b;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Archivo",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:-.01em;font-size:1.05rem;min-width:0}
  .brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--deep);display:grid;place-items:center;flex:none}
  .nav-links{display:flex;gap:20px;align-items:center;flex:none}
  .nav-links a{text-decoration:none;font-weight:500;font-size:.95rem;color:var(--ink-2)}
  .nav-links a:hover{color:var(--ink)}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
  .lang a{display:inline-block;text-decoration:none;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--ink-2)}
  .lang a[aria-current="page"]{background:var(--deep);color:#fff}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;transition:background .15s;cursor:pointer;font-size:.98rem}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dk)}
  .btn-ghost{border-color:rgba(255,255,255,.5);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-sm{padding:9px 16px;font-size:.9rem}
  @media (max-width:820px){.nav-links a:not(.btn){display:none}}
  @media (max-width:520px){.nav-links .btn{display:none}}
  @media (max-width:400px){.hide-sm{display:none}}

  /* Hero */
  .hero{background:var(--deep);color:#fff;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 60%;opacity:.28}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,48,43,.95) 0%,rgba(35,48,43,.75) 55%,rgba(35,48,43,.35) 100%);pointer-events:none}
  .hero-inner{position:relative;z-index:1;padding:88px 0 96px;max-width:720px}
  .eyebrow{display:inline-block;font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f0b07f;margin-bottom:18px}
  h1,h2{font-family:"Fraunces",Georgia,serif;letter-spacing:-.015em;line-height:1.08}
  h1{font-size:clamp(2.3rem,6vw,3.9rem);margin-bottom:20px}
  .hero p{font-size:1.15rem;color:#d5dbd7;max-width:560px;margin-bottom:32px}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
  .badges{display:flex;gap:22px;flex-wrap:wrap;margin-top:40px;font-size:.92rem;color:#c3cbc6}
  .badges span{display:flex;align-items:center;gap:8px}
  .badges svg{flex:none}

  /* Sections */
  section{padding:80px 0}
  .sec-head{max-width:640px;margin-bottom:40px}
  .sec-head h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:12px}
  .sec-head p{color:var(--ink-2);font-size:1.05rem}

  /* Services */
  .services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  @media (max-width:900px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.services{grid-template-columns:1fr}}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .svc-ic{width:44px;height:44px;border-radius:11px;background:#f6e6d9;display:grid;place-items:center;margin-bottom:16px}
  .svc h3{font-size:1.08rem;margin-bottom:6px}
  .svc p{color:var(--ink-2);font-size:.95rem}

  /* Gallery */
  #work{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .chip{border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:999px;font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;color:var(--ink-2)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:28px}
  .pager:empty{display:none}
  .pager button{border:1px solid var(--line);background:var(--paper);min-width:44px;height:44px;padding:0 14px;border-radius:999px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
  .pager button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pager button:disabled{opacity:.35;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .proj{border-radius:var(--radius);overflow:hidden;background:var(--paper);border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
  .proj:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
  .proj.featured{grid-column:1/-1}
  @media (min-width:820px){.proj.featured{flex-direction:row}.proj.featured .proj-img{flex:1.4;aspect-ratio:auto;min-height:380px}.proj.featured .proj-body{flex:1;padding:32px;display:flex;flex-direction:column;justify-content:center}.proj.featured h3{font-family:"Fraunces",serif;font-size:1.7rem;line-height:1.15;margin:8px 0 4px}}
  .proj-img{aspect-ratio:4/3;position:relative;overflow:hidden;background:#ddd}
  .proj-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:.85rem;font-weight:500;letter-spacing:.04em;text-align:center}
  .ph div{display:flex;flex-direction:column;align-items:center;gap:8px}
  .count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;padding:4px 9px;border-radius:999px}
  .new{position:absolute;left:10px;top:10px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .proj-body{padding:16px 18px 18px}
  .proj-tag{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
  .proj-body h3{font-size:1.05rem;margin:4px 0 2px}
  .proj-body p{font-size:.9rem;color:var(--ink-2)}
  .proj-body .proj-desc{margin-top:10px;color:var(--ink);font-size:.97rem;line-height:1.55}
  .proj-body .more{margin-top:14px;font-weight:600;color:var(--accent);font-size:.92rem}

  /* About */
  .about{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
  .about p{color:var(--ink-2);margin-bottom:14px;font-size:1.03rem}
  .review{background:var(--card);border-top:1px solid var(--line);padding:56px 0}
  .review-box{display:flex;align-items:center;justify-content:space-between;gap:24px 40px;flex-wrap:wrap}
  .review .stars{display:flex;gap:4px;margin-bottom:14px}
  .review h2{font-size:clamp(1.6rem,3.4vw,2.2rem);margin-bottom:8px}
  .review p{color:var(--ink-2);max-width:580px;font-size:1.03rem}
  .review-cta{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .review-cta small{color:var(--ink-2);font-size:.85rem;padding-left:4px}
  .owner{display:flex;align-items:center;gap:18px;margin:26px 0 0}
  .owner img{width:132px;height:132px;border-radius:50%;object-fit:cover;flex:none;border:4px solid var(--card);box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .owner b{display:block;font-family:"Fraunces",Georgia,serif;font-size:1.35rem;line-height:1.2}
  .owner span{display:block;color:var(--ink-2);font-size:.95rem;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat b{display:block;font-family:"Fraunces",serif;font-size:1.8rem;color:var(--deep)}
  .stat span{font-size:.85rem;color:var(--ink-2)}
  .quote{background:var(--deep);color:#e8ece9;border-radius:var(--radius);padding:32px}
  .quote p{font-family:"Fraunces",serif;font-size:1.3rem;line-height:1.4;color:#fff;margin-bottom:16px}
  .why{list-style:none;display:grid;gap:12px}
  .why li{position:relative;padding-left:28px;color:#dfe5e1}
  .why li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:8px;border-left:2.5px solid #f0b07f;border-bottom:2.5px solid #f0b07f;transform:rotate(-45deg)}
  @media (max-width:820px){.about{grid-template-columns:1fr}}

  /* Contact */
  #contact{background:var(--deep);color:#fff}
  #contact .sec-head p{color:#c3cbc6}
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .cc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:22px;text-decoration:none;display:block;transition:background .15s}
  a.cc:hover{background:rgba(255,255,255,.1)}
  .cc .lbl{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#f0b07f;font-weight:600;margin-bottom:8px}
  .cc .val{font-size:1.15rem;font-weight:600}
  .cc .sub{font-size:.88rem;color:#b7c1bb;margin-top:4px}


  .svc h3 a{color:inherit;text-decoration:none} .svc h3 a:hover{color:var(--accent)}
  .svc-more{display:inline-block;margin-top:10px;font-weight:600;font-size:.92rem;color:var(--accent);text-decoration:none}
  .big-ctas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:28px}
  .big-btn{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:18px;text-decoration:none;color:#fff;transition:transform .15s,background .15s}
  .big-btn:active{transform:scale(.98)}
  .big-btn b{display:block;font-size:1.35rem;font-weight:700}
  .big-btn small{display:block;font-size:.92rem;opacity:.85;margin-top:2px}
  .big-text{background:var(--accent)} .big-text:hover{background:var(--accent-dk)}
  .big-call{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)} .big-call:hover{background:rgba(255,255,255,.16)}
  footer{background:#181f1c;color:#8f9a94;font-size:.85rem;padding:28px 0}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* Lightbox */
  .lb{position:fixed;inset:0;background:rgba(10,12,11,.95);z-index:50;display:none;flex-direction:column}
  .lb.open{display:flex}
  .lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;color:#fff}
  .lb-top h3{font-size:1rem;font-weight:600}
  .lb-top small{color:#aab3ae;display:block;font-weight:400}
  .lb-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:grid;place-items:center;flex:none}
  .lb-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px 16px;min-height:0}
  .lb-frame{flex:1;height:100%;max-width:1100px;display:flex;align-items:center;justify-content:center;min-height:0}
  .lb-frame img,.lb-frame .lb-ph,.lb-frame video{max-width:100%;max-height:100%;border-radius:10px}
  .lb-frame video{background:#000}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(200,100,30,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);pointer-events:none}
  .proj:hover .play{background:var(--accent-dk)}
  .lb-frame .lb-ph{width:min(100%,800px);aspect-ratio:4/3;position:relative;overflow:hidden}
  .lb-cap{text-align:center;color:#c8d0cb;font-size:.92rem;max-width:720px;margin:0 auto;padding:0 20px 22px;line-height:1.5}
  .lb-cap b{color:#fff;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#top" class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 1.75 64 64"><rect x="4" y="14" width="56" height="8" rx="1.6" fill="#c8641e"/><rect x="4" y="24" width="18" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="24" y="24" width="14" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="40" y="24" width="20" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="4" y="34.5" width="11" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="17" y="34.5" width="24" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="43" y="34.5" width="17" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="4" y="45" width="22" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="28" y="45" width="15" height="8.5" rx="1.6" fill="#f6f3ee"/><rect x="45" y="45" width="15" height="8.5" rx="1.6" fill="#f6f3ee"/></svg></span>
      <span data-biz>JAM Construction<span class="hide-sm"> Services</span></span>
    </a>
    <nav class="nav-links">
      <a href="#services" data-t="navServices"></a>
      <a href="#work" data-t="navWork"></a>
      <a href="#about" data-t="navAbout"></a>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <a data-lang="en" href="{{HOME}}" hreflang="en" lang="en">EN</a>
        <a data-lang="es" href="{{ROOT}}es/" hreflang="es" lang="es">ES</a>
      </div>
      <a href="#contact" class="btn btn-primary btn-sm" data-t="navCta"></a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero" style="padding:0">
    <div class="hero-bg" style="background-image:url('{{ROOT}}photos/stone-wall-2.jpg')"></div>
    <div class="wrap">
      <div class="hero-inner">
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 data-t="h1"></h1>
        <p data-t="heroP"></p>
        <div class="hero-ctas">
          <a data-sms href="sms:+14439018869" class="btn btn-primary" data-t="ctaEstimate"></a>
          <a href="#work" class="btn btn-ghost" data-t="ctaWork"></a>
        </div>
        <div class="badges">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0b07f" stroke-width="2.2"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><b style="font-weight:500" data-t="b1"></b></span>
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0b07f" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b style="font-weight:500" data-t="b2"></b></span>
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0b07f" stroke-width="2.2"><path d="M20 7 9 18l-5-5"/></svg><b style="font-weight:500" data-t="b3"></b></span>
        </div>
      </div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="svcH"></h2>
        <p data-t="svcP"></p>
      </div>
      <div class="services" id="services-list"></div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="workH"></h2>
        <p data-t="workP"></p>
      </div>
      <div class="filters" id="filters" role="group"></div>
      <div class="grid" id="grid"></div>
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <div>
        <div class="sec-head" style="margin-bottom:18px"><h2 data-t="aboutH"></h2></div>
        <p data-t="aboutP1"></p>
        <p data-t="aboutP2"></p>
        <figure class="owner">
          <img src="{{ROOT}}photos/jorge-portrait.jpg" data-alt="ownerAlt" alt="" width="132" height="132" loading="lazy">

      </div>
      <div class="quote">
        <p data-t="whyH"></p>
        <ul class="why">
          <li data-t="why1"></li><li data-t="why2"></li><li data-t="why3"></li><li data-t="why4"></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="review" id="review" data-review>
    <div class="wrap review-box">
      <div>
        <div class="stars" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c8641e"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="#c8641e"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="#c8641e"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="#c8641e"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="#c8641e"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg></div>
        <h2 data-t="revH"></h2>
        <p data-t="revP"></p>
      </div>
      <div class="review-cta">
        <a class="btn btn-primary" href="{{REVIEW_URL}}" target="_blank" rel="noopener"><span data-t="revBtn"></span><span aria-hidden="true">→</span></a>
        <small data-t="revSmall"></small>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="ctH"></h2>
        <p data-t="ctP"></p>

  }
};

const CATS = {
  stone:{en:"Stone Walls", es:"Muros de piedra"},
  pave:{en:"Patios & Walkways", es:"Patios y caminos"},
  fence:{en:"Fences & Outdoor Structures", es:"Cercas y estructuras exteriores"},
  exterior:{en:"Siding & Exteriors", es:"Revestimiento y exteriores"},
  build:{en:"Decks, Garages & Sheds", es:"Decks, garajes y cobertizos"},
  interior:{en:"Bathrooms, Basements & Interiors", es:"Baños, sótanos e interiores"}
};

const SERVICES = [
  {c:"stone", u:{en:"services/stone-walls/", es:"servicios/muros-de-piedra/"}, d:{en:"Dry-stacked stone walls, retaining walls, stone stairs, outdoor fireplaces, fire pits, garden beds and flagstone caps.", es:"Muros de piedra apilada en seco, muros de contención, escaleras de piedra, chimeneas al aire libre, fogatas, jardineras y cubiertas de laja."},
   i:'<rect x="3" y="5" width="8" height="4" rx="1"/><rect x="13" y="5" width="8" height="4" rx="1"/><rect x="3" y="11" width="5" height="4" rx="1"/><rect x="10" y="11" width="11" height="4" rx="1"/><rect x="3" y="17" width="18" height="3" rx="1"/>'},
  {c:"pave", u:{en:"services/patios-walkways/", es:"servicios/patios-y-caminos/"}, d:{en:"Paver patios, front walkways, pool decks and steps, built on a properly compacted base.", es:"Patios de adoquín, caminos de entrada, terrazas de piscina y escalones, sobre una base bien compactada."},
   i:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>'},
  {c:"fence", u:{en:"services/fences-pergolas/", es:"servicios/cercas-y-pergolas/"}, d:{en:"Wood fences, privacy screens and pergolas, set on solid posts.", es:"Cercas de madera, paneles de privacidad y pérgolas, sobre postes firmes."},
   i:'<path d="M5 21V6l2-3 2 3v15M15 21V6l2-3 2 3v15"/><path d="M3 10h18M3 16h18"/>'},
  {c:"build", u:{en:"services/decks-garages-sheds/", es:"servicios/decks-garajes-cobertizos/"}, d:{en:"New decks, garages, sheds and other exterior structures, framed solid and built to last.", es:"Decks nuevos, garajes, cobertizos y otras estructuras exteriores, con estructura firme y hechos para durar."},
   i:'<path d="M3 10 12 4l9 6v10H3z"/><path d="M7 20v-7h10v7M7 16.5h10"/>'},
  {c:"exterior", u:{en:"services/siding-prep/", es:"servicios/preparacion-de-revestimiento/"}, d:{en:"Exterior wall sheathing, weather barrier and furring strips to prepare homes for new siding.", es:"Revestimiento exterior de paredes, barrera contra el clima y listones para preparar la casa para revestimiento nuevo."},
   i:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-9M12 20v-9M15 20v-9"/>'},
  {c:"interior", u:{en:"services/bathrooms-basements/", es:"servicios/banos-y-sotanos/"}, d:{en:"Bathroom remodels, interior remodeling, basement finishing and basement waterproofing.", es:"Remodelación de baños e interiores, acabado de sótanos e impermeabilización de sótanos."},
   i:'<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 12V6a2 2 0 0 1 4 0"/><path d="M7 19l-1 2M17 19l1 2"/>'}
];

const PROJECTS = /*JOBS*/[]/*END JOBS*/;
const LATEST = PROJECTS.findIndex(p => !p.featured);
/* ========================================================= */

const $ = s => document.querySelector(s);
const altOf = (p, i) => (p.alts && p.alts[lang] && p.alts[lang][i]) || p.title[lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#yr').textContent = new Date().getFullYear();

const ROOT = document.documentElement.dataset.root || '';
const lang = document.documentElement.lang === 'es' ? 'es' : 'en';
let active = 'all', cur = null, pi = 0, page = 1;
const PER_PAGE = 12; // jobs per gallery page
const T = k => TEXT[lang][k];

function renderStatic(){
    document.querySelectorAll('[data-t]').forEach(el => { const v = T(el.dataset.t); if (v != null) el.textContent = v; });
  document.querySelectorAll('[data-alt]').forEach(el => { const v = T(el.dataset.alt); if (v != null) el.alt = v; });
  document.querySelectorAll('.lang a').forEach(a => a.dataset.lang === lang ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('#filters').setAttribute('aria-label', lang==='es' ? 'Filtrar proyectos' : 'Filter projects');
  $('#lbClose').setAttribute('aria-label', lang==='es' ? 'Cerrar' : 'Close');
  document.querySelectorAll('[data-sms]').forEach(a => a.href = 'sms:+14439018869?&body=' + encodeURIComponent(T('smsBody')));
  document.querySelectorAll('[data-mail]').forEach(a => a.href = 'mailto:jorge@jamconstructionmd.com?subject=' + encodeURIComponent(T('mailSubject')) + '&body=' + encodeURIComponent(T('mailBody')));
}

function renderServices(){
  $('#services-list').innerHTML = SERVICES.map(s => `
    <div class="svc">
      <div class="svc-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c8641e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.i}</svg></div>
      <h3><a href="${esc(s.u[lang])}">${esc(CATS[s.c][lang])}</a></h3><p>${esc(s.d[lang])}</p>
      <a class="svc-more" href="${esc(s.u[lang])}">${T('svcMore')}</a>
    </div>`).join('');
}

function placeholder(p){
  const h = p.hue ?? 30;
  return `<div class="ph" style="background:linear-gradient(135deg,hsl(${h} 22% 38%),hsl(${(h+30)%360} 18% 24%))">
    <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>
    <span>${T('soon')}</span></div></div>`;
}

function renderFilters(){
  const cats = ['all', ...new Set(PROJECTS.map(p => p.c))];
  $('#filters').style.display = cats.length > 2 ? '' : 'none';
  $('#filters').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===active}" data-c="${c}">${esc(c==='all' ? T('all') : CATS[c][lang])}</button>`).join('');
}

function renderGrid(){
  const list = PROJECTS.map((p,i) => ({p,i})).filter(x => active==='all' || x.p.c===active);
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  page = Math.min(page, pages);
  renderPager(pages);
  $('#grid').innerHTML = list.slice((page-1)*PER_PAGE, page*PER_PAGE).map(({p,i}) => {
    const n = p.photos.length, feat = p.featured && active==='all', vid = !!p.video;
    const img = vid
      ? `<img src="${esc(ROOT + p.poster)}" alt="${esc(altOf(p,0))}" loading="lazy"><span class="play" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg></span><span class="count">${T('videoTag')}</span>`
      : n ? `<img src="${esc(ROOT + p.photos[0])}" alt="${esc(altOf(p,0))}" loading="${i===0?'eager':'lazy'}">` : placeholder(p);
    return `<button class="proj${feat?' featured':''}" data-i="${i}">
      <div class="proj-img">${img}${i===LATEST&&n?`<span class="new">${T('newTag')}</span>`:''}${n>1?`<span class="count">${n} ${T('photos')}</span>`:''}</div>
      <div class="proj-body">
        <div class="proj-tag">${esc(CATS[p.c][lang])}</div>
        <h3>${esc(p.title[lang])}</h3>${p.loc?`<p>${esc(p.loc)}</p>`:''}
        ${(n||vid) ? `<p class="proj-desc">${esc(p.note[lang])}</p><div class="more">${T(vid?'watchVideo':n>1?'viewPhotos':'viewPhoto')}</div>` : ''}
      </div>
    </button>`;
  }).join('');
}

function renderPager(pages){
  if (pages < 2) { $('#pager').innerHTML = ''; return; }
  const nums = Array.from({length: pages}, (_, k) => k + 1)
    .map(k => `<button data-p="${k}" ${k===page?'aria-current="page"':''} aria-label="${T('pageWord')} ${k}">${k}</button>`).join('');
  $('#pager').setAttribute('aria-label', T('pagesLabel'));
  $('#pager').innerHTML = `<button data-p="${page-1}" ${page===1?'disabled':''}>${T('newer')}</button>${nums}<button data-p="${page+1}" ${page===pages?'disabled':''}>${T('older')}</button>`;
}

function renderAll(){ renderStatic(); renderServices(); renderFilters(); renderGrid(); if (cur!==null && $('#lb').classList.contains('open')) show(); }

$('#filters').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; active = b.dataset.c; page = 1; renderFilters(); renderGrid(); });
$('#pager').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if(!b || b.disabled) return; page = +b.dataset.p; renderGrid(); $('#work').scrollIntoView({behavior:'smooth'}); });

/* Lightbox */
function show(){
  const p = PROJECTS[cur], n = Math.max(p.photos.length, 1);
  $('#lbTitle').textContent = p.title[lang];
  $('#lbSub').textContent = [p.loc, CATS[p.c][lang]].filter(Boolean).join(' · ');
  const v = $('#lbFrame video');
  if (p.video && v && v.getAttribute('src') === p.video) { $('#lbCap').textContent = p.note[lang]; return; }
  $('#lbFrame').innerHTML = p.video
    ? `<video src="${esc(ROOT + p.video)}" poster="${esc(p.poster ? ROOT + p.poster : '')}" controls autoplay playsinline preload="metadata"></video>`
    : p.photos.length
    ? `<img src="${esc(ROOT + p.photos[pi])}" alt="${esc(altOf(p,pi))}">`
    : `<div class="lb-ph">${placeholder(p)}</div>`;
  $('#lbCap').innerHTML = `${n>1?`<b>${pi+1} / ${n}</b> · `:''}${esc(p.note[lang])}`;
  $('#lbPrev').style.visibility = $('#lbNext').style.visibility = n>1 ? 'visible' : 'hidden';
}
function openLb(i){ cur = i; pi = 0; show(); $('#lb').classList.add('open'); document.body.style.overflow='hidden'; $('#lbClose').focus(); }
function closeLb(){ $('#lb').classList.remove('open'); document.body.style.overflow=''; $('#lbFrame').innerHTML=''; }
function step(d){ const n = PROJECTS[cur].photos.length; if(n>1){ pi = (pi+d+n)%n; show(); } }
$('#grid').addEventListener('click', e => { const b = e.target.closest('.proj'); if(b) openLb(+b.dataset.i); });
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = () => step(-1);
$('#lbNext').onclick = () => step(1);
$('#lb').addEventListener('click', e => { if(e.target.id==='lb' || e.target.classList.contains('lb-stage')) closeLb(); });
document.addEventListener('keydown', e => {
  if(!$('#lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1);
});
let tx=null;
$('#lbFrame').addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
$('#lbFrame').addEventListener('touchend', e => { if(tx==null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>40) step(dx<0?1:-1); tx=null; });

renderAll();
</script>
